name: Publish Clawk

on:
  push:
    branches: [dev, main, feat/firefox-tls-helper]
  workflow_dispatch:

concurrency:
  group: publish-clawk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=clawk-${{ matrix.arch }}
          cache-to: type=gha,scope=clawk-${{ matrix.arch }},mode=max
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test native transport
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --network none --entrypoint bun \
            -v "$PWD/packages/tiers/tests:/app/packages/tiers/tests:ro" \
            "$IMAGE@$DIGEST" test \
            packages/tiers/tests/tlsTransport.test.ts \
            packages/tiers/tests/runTier1Encoding.test.ts \
            packages/tiers/tests/trustedProxyCa.test.ts \
            packages/tiers/tests/ignoreCertificateErrors.test.ts
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: clawk-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: clawk-digest-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish multiarch image
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"