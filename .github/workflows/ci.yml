name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify; defaults to the triggering ref
        required: false
        type: string
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/tls-fetch/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run verify
